<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4efff" />
  <meta name="description" content="RPG Life — личная RPG без наказания за пропуски." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>RPG Life</title>
</head>
<body>
  <noscript>
    <div style="max-width:720px;margin:32px auto;padding:20px;border:1px solid #c8b9e8;border-radius:16px;background:#fff;color:#2b2340;font:16px/1.5 system-ui,sans-serif">
      <b>RPG Life не может запуститься: JavaScript отключён или заблокирован браузером.</b><br>
      Данные приложения не удалены.
    </div>
  </noscript>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="today" aria-label="RPG Life — на главную">
        <span class="brand-mark">R</span>
        <span><b>RPG Life</b><small>своя сага важнее пустых галочек</small></span>
      </button>
      <div class="top-actions">
        <button id="installBtn" class="ghost hidden">Установить</button>
        <button id="quickAddBtn" class="primary">＋ Записать</button>
      </div>
    </header>
    <nav class="top-tabs" aria-label="Навигация">
      <button data-nav="today" class="active"><span>⌂</span><small>День</small></button>
      <button data-nav="branches"><span>⌁</span><small>Персонаж</small></button>
      <button data-nav="battles"><span>⚔</span><small>Арена</small></button>
      <button data-nav="buffs"><span>✦</span><small>Бафы</small></button>
      <button data-nav="rewards"><span>◆</span><small>Награды</small></button>
      <button data-nav="memory"><span>✧</span><small>Память</small></button>
      <button data-nav="year"><span>▦</span><small>Год</small></button>
    </nav>
    <main id="app"></main>
  </div>
  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
