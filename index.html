<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4efff" />
  <meta name="description" content="RPG Life — личная RPG без наказания за пропуски." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="fantasy.css" />

  <title>RPG Life</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="today" aria-label="RPG Life — на главную">
        <span class="brand-mark">R</span>
        <span><b>RPG Life</b><small>своя сага важнее пустых галочек</small></span>
      </button>
      <div class="top-actions">
        <button id="installBtn" class="ghost hidden">Установить</button>
        <button id="quickAddBtn" class="primary">＋ Записать</button>
      </div>
    </header>
    <main id="app"></main>
    <nav class="bottom-nav" aria-label="Навигация">
      <button data-nav="today" class="active"><span>⌂</span><small>День</small></button>
      <button data-nav="branches"><span>⌁</span><small>Персонаж</small></button>
      <button data-nav="battles"><span>⚔</span><small>Арена</small></button>
      <button data-nav="buffs"><span>✦</span><small>Бафы</small></button>
      <button data-nav="rewards"><span>◆</span><small>Награды</small></button>
      <button data-nav="memory"><span>✧</span><small>Память</small></button>
      <button data-nav="year"><span>▦</span><small>Год</small></button>
    </nav>
  </div>
  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
  <script src="calorie-bank.js" defer></script>
  <script src="rpg-simple-bank.js" defer></script>
  <script src="gameplay-v5.js" defer></script>
  <script src="gameplay-v6.js" defer></script>
  <script src="gameplay-v7.js" defer></script>
  <script src="gameplay-v8.js" defer></script>
  <script src="gameplay-v10.js" defer></script>
  <script src="gameplay-v11.js" defer></script>
  <script src="gameplay-v12.js" defer></script>
  <script src="gameplay-v13.js" defer></script>
  <script src="gameplay-v14.js" defer></script>
  <script src="gameplay-v15.js" defer></script>
  <script src="gameplay-v16.js" defer></script>
  <script src="gameplay-v17.js?v=30" defer></script>
  <script src="gameplay-v18.js?v=31" defer></script>
  <script src="gameplay-v19.js?v=32" defer></script>
  <script src="gameplay-v20.js?v=33" defer></script>
</body>
</html>
