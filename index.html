<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4efff" />
  <meta name="description" content="RPG Life — личная RPG без наказания за пропуски." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="fantasy.css" />
  <link rel="stylesheet" href="rpg-v2.css" />
  <link rel="stylesheet" href="rpg-v4.css" />
  <title>RPG Life</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="today" aria-label="RPG Life — на главную">
        <span class="brand-mark">R</span>
        <span><b>RPG Life</b><small>своя сага важнее пустых галочек</small></span>
      </button>
      <div class="top-actions">
        <button id="installBtn" class="ghost hidden">Установить</button>
        <button id="quickAddBtn" class="primary">＋ Записать</button>
      </div>
    </header>
    <main id="app"></main>
    <nav class="bottom-nav" aria-label="Навигация">
      <button data-nav="today" class="active"><span>⌂</span><small>Сегодня</small></button>
      <button data-nav="branches"><span>⌁</span><small>Ветки</small></button>
      <button data-nav="battles"><span>⚔</span><small>Битвы</small></button>
      <button data-nav="rewards"><span>💎</span><small>Награды</small></button>
      <button data-nav="memory"><span>✦</span><small>Память</small></button>
      <button data-nav="year"><span>▦</span><small>Год</small></button>
    </nav>
  </div>
  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
  <script src="calorie-bank.js" defer></script>
</body>
</html>
