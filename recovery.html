<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RPG Life — восстановление</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f0fb;color:#493b55;margin:0;padding:20px}.wrap{max-width:820px;margin:auto}.card{background:#fff;border:1px solid #ded2e7;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 26px rgba(72,52,88,.08)}h1{margin:0 0 8px}h2{margin:0 0 8px;font-size:18px}.muted{color:#8e8197;font-size:13px}.good{color:#2f7d58;font-weight:800}.warn{color:#a05c3d;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.stat{background:#f8f4fb;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:1px solid #cdbed9;background:#f6effb;color:#5e4b6d;border-radius:12px;padding:10px 12px;font-weight:700}.small{font-size:12px}.names{margin-top:8px;padding-top:8px;border-top:1px solid #eee4f2;font-size:12px;line-height:1.5}code{font-size:11px;word-break:break-all}@media(max-width:560px){.grid{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="wrap">
<h1>Аварийное восстановление RPG Life</h1>
<p class="muted">Эта страница ничего не синхронизирует и ничего не перезаписывает. Она только читает локальные данные этого устройства.</p>
<div id="out"></div>
</div>
<script>
const KEY='rpg-life-v4',H='rpg-life-safety-history',OLD='rpg-life-safety-backup';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
const dateLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function summary(s){s=s||{};const today=dateLocal();const pl=Array.isArray(s.practiceLogs)?s.practiceLogs:[];const ps=Array.isArray(s.practices)?s.practices:[];const bosses=Array.isArray(s.bosses)?s.bosses:[];return{today,practiceLogs:pl.length,todayLogs:pl.filter(x=>x.date===today).length,practices:ps.length,bosses:bosses.length,achievements:(s.achievements||[]).length,gryzliki:(s.gryzliki||[]).length,buffs:(s.buffDefinitions||[]).length,memories:Object.keys(s.dayMemories||{}).length,bossNames:bosses.map(x=>x.title).filter(Boolean).slice(0,8),todayNames:pl.filter(x=>x.date===today).map(l=>ps.find(p=>p.id===l.practiceId)?.name||l.practiceId).filter(Boolean).slice(0,12)}}
function dl(name,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function card(title,stamp,state,idx){const x=summary(state);return `<div class="card"><div class="row"><div><h2>${esc(title)}</h2><div class="muted">${esc(stamp||'время неизвестно')}</div></div><button class="btn" data-dl="${idx}">Скачать JSON</button></div><div class="grid"><div class="stat"><span>Практик сегодня</span><b>${x.todayLogs}</b></div><div class="stat"><span>Всего записей практик</span><b>${x.practiceLogs}</b></div><div class="stat"><span>Боссов</span><b>${x.bosses}</b></div><div class="stat"><span>Настроенных практик</span><b>${x.practices}</b></div></div>${x.todayNames.length?`<div class="names"><b>Сегодня:</b> ${x.todayNames.map(esc).join(' · ')}</div>`:''}${x.bossNames.length?`<div class="names"><b>Боссы:</b> ${x.bossNames.map(esc).join(' · ')}</div>`:''}</div>`}
const current=parse(KEY),history=parse(H)||[],old=parse(OLD),items=[];let html='';
if(current){items.push({name:'current',data:current});html+=card('Текущее локальное состояние','сейчас',current,items.length-1)}else html+='<div class="card warn">Текущего локального состояния нет.</div>';
if(Array.isArray(history)&&history.length){history.forEach((b,i)=>{if(!b?.state)return;items.push({name:`backup-${i+1}`,data:b.state});html+=card(`Страховка №${i+1}`,b.at?new Date(b.at).toLocaleString('ru-RU'):'',b.state,items.length-1)})}else html+='<div class="card muted">История страховок на этом устройстве не найдена.</div>';
if(old){items.push({name:'old-safety-backup',data:old});const pseudo={practiceLogs:old.practiceLogs||[],creativeLogs:old.creativeLogs||[],achievements:old.achievements||[],currencyLedger:old.currencyLedger||[],campaigns:old.campaigns||[],wallet:old.wallet||{}};html+=card('Старая аварийная страховка',old.at?new Date(old.at).toLocaleString('ru-RU'):'',pseudo,items.length-1)}
html+=`<div class="card small"><b>Технические метки</b><br>cloud-stamp: <code>${esc(localStorage.getItem('rpg-life-cloud-stamp')||'—')}</code><br>unsynced: <code>${esc(localStorage.getItem('rpg-life-unsynced')||'—')}</code></div>`;
document.querySelector('#out').innerHTML=html;document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const it=items[Number(b.dataset.dl)];dl(`rpg-life-${it.name}-${Date.now()}.json`,it.data)});
</script></body></html>
